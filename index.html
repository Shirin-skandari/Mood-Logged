<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Mood Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="card-container">
            <header>
                <h1>Mood Logged</h1>
                <p>a little space for your feelings</p>
            </header>

            <div class="mood-question">
               <h2>How are you feeling today?</h2>
            </div>

            <div class="mood-buttons">
                <div class="mood-card happy-mood">
                    <span>😊</span>
                    <p>Happy</p>
                </div>
                <div class="mood-card sad-mood">
                    <span>🥲</span>
                    <p>Sad</p>
                </div>

                <div class="mood-card excited-mood">
                    <span>🤩</span>
                    <p>Excited</p>
                </div>

                <div class="mood-card angry-mood">
                    <span>😡</span>
                    <p>Angry</p>
                </div>
               
            </div>
                
            <div class="selected-mood">
                <h3>You chose: <span id="selected-mood-name">-</span></h3>
                <p>-</p>
            </div>
            <div class="journal-section">
                <label for="mood-note">Today I feel...</label>
                <textarea id="mood-note" placeholder="Write what's on your mind..."></textarea>
            </div>

            <button class="log-button">♡ Log my mood</button>
            
            <p id="empty-state">No moods logged yet💗</p>
            
            <section class="mood-history">
                <h2>Your Mood History</h2>

                <div id="mood-history-list"></div>
            </section>
            <footer>
                <p>Small steps · Better days</p>
            </footer>

        </div>
            
            
    
       
    </main>

     <script src="script.js" defer></script>
</body>
</html>
