<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Mood Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="card-container">
            <h1 class="card-header">Daily Mood Tracker</h1>
            <p>
                How are you feeling today?
            </p>

            <div class="mood-buttons">
                <button class="happy-mood">
                <span>😊Happy</span>
                </button>
                <button class="sad-mood">
                <span>🥲Sad</span> 
                </button>
                <button class="excited-mood">
                <span>🤩Excited</span> 
                </button>
                <button class="angry-mood">
                <span>😡Angry</span> 
                </button>
                
                <p>Click a button to select your mood</p>
            </div>

        
        </div>
    
        <script src="script.js" defer></script>
    </main>
</body>
</html>
